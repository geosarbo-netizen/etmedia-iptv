name: Update ET Media playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: etmedia-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        env:
          ET_AUTH_TOKEN: ${{ secrets.ET_AUTH_TOKEN }}
          ET_PROFILE_UID: ${{ secrets.ET_PROFILE_UID }}
          ET_DEVICE_UID: ${{ secrets.ET_DEVICE_UID }}
        run: python update_etmedia.py

      - name: Publish playlist
        run: |
          git config user.name "ETMedia updater"
          git config user.email "actions@users.noreply.github.com"
          git add ETMedia.m3u
          if git diff --cached --quiet; then
            echo "Playlist unchanged"
          else
            git commit -m "Update ETMedia playlist"
            git push
          fi
