name: ET Media diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run diagnostic
        env:
          ET_AUTH_TOKEN: ${{ secrets.ET_AUTH_TOKEN }}
          ET_PROFILE_UID: ${{ secrets.ET_PROFILE_UID }}
          ET_DEVICE_UID: ${{ secrets.ET_DEVICE_UID }}
        run: python update_etmedia.py

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etmedia-debug
          path: debug/
          if-no-files-found: error
          retention-days: 3
